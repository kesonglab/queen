name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & publish macOS binaries
    runs-on: macos-latest
    strategy:
      matrix:
        goos: [darwin]
        goarch: [arm64, amd64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Derive version
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w -X main.version=${{ steps.ver.outputs.version }}" -o "dist/queen-${{ matrix.goos }}-${{ matrix.goarch }}/queen" .

      - name: Archive
        run: |
          cd dist
          zip -r "queen-${{ matrix.goos }}-${{ matrix.goarch }}.zip" "queen-${{ matrix.goos }}-${{ matrix.goarch }}"
          cd ..

      # 只上传 zip：SHA-256 清单由下面的 checksums job 统一生成，
      # 避免 matrix 的两个 job 并发写同名 checksums.txt 互相覆盖。
      - name: Upload archives to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checksums:
    name: Aggregate SHA-256 checksums
    runs-on: macos-latest
    needs: release
    steps:
      - name: Download published archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "$GITHUB_REF_NAME" --pattern '*.zip' --dir dist

      - name: Generate checksums.txt
        run: |
          cd dist
          shasum -a 256 *.zip | sort -k2 > checksums.txt
          cat checksums.txt

      - name: Upload checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/checksums.txt --clobber
