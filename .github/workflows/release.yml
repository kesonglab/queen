name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & publish macOS binaries
    runs-on: macos-latest
    strategy:
      matrix:
        goos: [darwin]
        goarch: [arm64, amd64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Derive version
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w -X main.version=${{ steps.ver.outputs.version }}" -o "dist/queen-${{ matrix.goos }}-${{ matrix.goarch }}/queen" .

      - name: Archive
        run: |
          cd dist
          zip -r "queen-${{ matrix.goos }}-${{ matrix.goarch }}.zip" "queen-${{ matrix.goos }}-${{ matrix.goarch }}"
          shasum -a 256 "queen-${{ matrix.goos }}-${{ matrix.goarch }}.zip" >> checksums.txt
          cd ..

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
